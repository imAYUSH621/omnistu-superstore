<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="mw-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </radialGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="mw-shadow">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#mw-bg)"/>
  
  <g filter="url(#mw-shadow)">
    <!-- Base Plate -->
    <circle cx="300" cy="300" r="190" fill="#e2e8f0"/>
    <circle cx="300" cy="300" r="175" fill="url(#glass)"/>
    
    <!-- Heated Zone Ring -->
    <circle cx="300" cy="300" r="130" fill="none" stroke="#f97316" stroke-width="4" opacity="0.8"/>
    <circle cx="300" cy="300" r="130" fill="#ea580c" opacity="0.08"/>
    
    <!-- Digital OLED Temperature Display -->
    <rect x="235" y="375" width="130" height="45" rx="10" fill="#020617" stroke="#334155" stroke-width="1.5"/>
    <text x="300" y="405" font-family="monospace, monospace" font-size="20" font-weight="900" fill="#f97316" text-anchor="middle" letter-spacing="1">55°C</text>
    
    <!-- Ceramic Mug Outline -->
    <ellipse cx="300" cy="270" rx="80" ry="25" fill="#f8fafc"/>
    <path d="M220 270 Q215 340 240 345 Q300 355 360 345 Q385 340 380 270 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Mug Handle -->
    <path d="M380 280 C420 280 420 335 375 335" fill="none" stroke="#cbd5e1" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Steam Lines -->
    <path d="M280 230 Q270 200 285 170" fill="none" stroke="#ea580c" stroke-width="3" opacity="0.5" stroke-linecap="round"/>
    <path d="M305 235 Q320 200 300 165" fill="none" stroke="#ea580c" stroke-width="3" opacity="0.6" stroke-linecap="round"/>
    <path d="M325 230 Q335 195 320 170" fill="none" stroke="#ea580c" stroke-width="3" opacity="0.4" stroke-linecap="round"/>
  </g>
  <rect x="180" y="495" width="240" height="42" rx="21" fill="#0f172a"/>
  <text x="300" y="521" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f97316" text-anchor="middle" letter-spacing="1.5">GRAVITY SENSOR INDUCTION</text>
</svg>