<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </radialGradient>
    <radialGradient id="sphere-metallic" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#94a3b8"/>
      <stop offset="75%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </radialGradient>
    <radialGradient id="sphere-gold" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="80%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#713f12"/>
    </radialGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="15" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg2)"/>
  
  <g filter="url(#shadow2)">
    <!-- Pyramid Cluster of Balls -->
    <circle cx="230" cy="350" r="60" fill="url(#sphere-metallic)"/>
    <circle cx="370" cy="350" r="60" fill="url(#sphere-metallic)"/>
    <circle cx="300" cy="350" r="60" fill="url(#sphere-gold)"/>
    <circle cx="265" cy="250" r="60" fill="url(#sphere-gold)"/>
    <circle cx="335" cy="250" r="60" fill="url(#sphere-metallic)"/>
    <circle cx="300" cy="165" r="60" fill="url(#sphere-gold)"/>
  </g>
  <rect x="180" y="490" width="240" height="42" rx="21" fill="#0f172a"/>
  <text x="300" y="516" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fef08a" text-anchor="middle" letter-spacing="1">4-PACK TACTILE SET</text>
</svg>