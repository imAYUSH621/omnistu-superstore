<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="fd-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>
    <linearGradient id="flame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <filter id="flame-glow">
      <feDropShadow dx="0" dy="-10" stdDeviation="25" flood-color="#f97316" flood-opacity="0.8"/>
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#fd-bg)"/>
  
  <!-- Diffuser Body -->
  <rect x="140" y="320" width="320" height="150" rx="24" fill="#27272a" stroke="#3f3f46" stroke-width="2"/>
  <rect x="160" y="340" width="280" height="12" rx="6" fill="#18181b"/>
  <!-- Mist Vent Opening -->
  <rect x="180" y="305" width="240" height="18" rx="8" fill="#18181b"/>
  
  <!-- Ultrasonic Flame Mist Effect -->
  <g filter="url(#flame-glow)">
    <path d="M210 305 Q220 220 230 180 Q240 250 255 220 Q270 170 285 240 Q300 150 315 230 Q330 170 345 250 Q360 200 375 240 Q385 220 395 305 Z" fill="url(#flame)" opacity="0.9"/>
  </g>
  
  <!-- Brass Power & Light Control Knob -->
  <circle cx="300" cy="410" r="18" fill="#d97706" stroke="#fef08a" stroke-width="2"/>
  <circle cx="300" cy="410" r="6" fill="#451a03"/>

  <rect x="180" y="500" width="240" height="42" rx="21" fill="#27272a" stroke="#f97316" stroke-width="1.5"/>
  <text x="300" y="526" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fde047" text-anchor="middle" letter-spacing="1.5">ULTRASONIC FLAME MIST</text>
</svg>