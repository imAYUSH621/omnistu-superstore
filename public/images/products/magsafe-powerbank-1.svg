<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="pb-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    <linearGradient id="titanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="pb-shadow">
      <feDropShadow dx="15" dy="25" stdDeviation="18" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#pb-bg)"/>
  
  <g transform="rotate(-10 300 280)" filter="url(#pb-shadow)">
    <!-- Battery Chassis -->
    <rect x="180" y="110" width="240" height="350" rx="36" fill="url(#titanium)"/>
    <!-- Chamfer Edge Highlight -->
    <rect x="185" y="115" width="230" height="340" rx="32" fill="none" stroke="#94a3b8" stroke-width="2" opacity="0.6"/>
    
    <!-- MagSafe Magnetic Ring -->
    <circle cx="300" cy="260" r="75" fill="none" stroke="#0ea5e9" stroke-width="12" stroke-dasharray="14,6"/>
    <rect x="294" y="345" width="12" height="35" rx="6" fill="#0ea5e9"/>
    
    <!-- LED Indicators -->
    <circle cx="230" cy="420" r="4" fill="#38bdf8"/>
    <circle cx="245" cy="420" r="4" fill="#38bdf8"/>
    <circle cx="260" cy="420" r="4" fill="#38bdf8"/>
    <circle cx="275" cy="420" r="4" fill="#38bdf8"/>
    
    <!-- Capacity Label -->
    <text x="370" y="424" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="end">10,000 mAh</text>
  </g>
  <rect x="180" y="495" width="240" height="42" rx="21" fill="#0f172a"/>
  <text x="300" y="521" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1.5">15W Qi2 FAST WIRELESS</text>
</svg>